x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Спільне для api і migrate: той самий образ і ті самі налаштування
x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    SECRET_KEY: ${SECRET_KEY:-}
  logging: *logging

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Одноразово застосовує міграції й завершується; api чекає на його успіх
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [proxy, data]

  nginx:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on: [api]
    networks: [proxy]
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [nginx]
    networks: [proxy]
    logging: *logging

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true

volumes:
  pgdata: