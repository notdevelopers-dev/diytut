limit_req_zone  $binary_remote_addr zone=api_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 8080 default_server;
    server_name _;

    set_real_ip_from 172.30.0.0/24;
    real_ip_header   CF-Connecting-IP;

    client_max_body_size 5m;

    root /usr/share/nginx/html;

    location /api/ {
        limit_req  zone=api_rate burst=20 nodelay;
        limit_conn api_conn 20;
        limit_req_status  429;
        limit_conn_status 429;

        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;

        # Фото проєкту: бекенд приймає до 10 МБ, тут запас на обгортку multipart, щоб
        # про завеликий файл відповідав бекенд (JSON із поясненням), а не nginx.
        # Ліміти запитів і заголовки успадковуються з /api/, а proxy_pass — ні
        location ~ ^/api/projects/\d+/photo$ {
            client_max_body_size 11m;
            proxy_pass http://api:8000;
        }
    }

    # Завантажені фото з volume, спільного з api. Окремо від /api/, щоб картинки каталогу не
    # витрачали ліміт запитів до API. Ім'я файлу випадкове, а нове фото — це новий файл,
    # тож браузер може кешувати назавжди.
    # Cloudflare тримає файл у себе лише добу (заголовок читає тільки він і далі не передає):
    # фото, видалене організацією чи адміністратором за скаргою, щонайпізніше за добу
    # перестане віддаватися й за старою адресою, без ручного очищення кешу
    location /media/ {
        root /srv;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cloudflare-CDN-Cache-Control "max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}